  <circle cx="56" cy="54" r="4" fill="#0f172a"/>
  <circle cx="72" cy="54" r="4" fill="#0f172a"/>
  <!-- Commander Visor / Helmet Accent -->
  <path d="M42 44 H86" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <!-- Blue Tunic Body -->
  <path d="M40 72 L88 72 L94 104 L34 104 Z" rx="8" fill="url(#tunic)"/>
  <!-- Builder Pickaxe / Blueprint Scroll Icon -->
  <rect x="52" y="80" width="24" height="16" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <line x1="56" y1="85" x2="72" y2="85" stroke="#3b82f6" stroke-width="2"/>
  <line x1="56" y1="91" x2="68" y2="91" stroke="#22c55e" stroke-width="2"/>
</svg>
